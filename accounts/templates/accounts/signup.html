{% extends "base.html" %}
{% load static %}

{% block title %}
    Folio | Signup
{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static "accounts/css/auth.css" %}">
{% endblock  %}

{% block content %}
    <div class="">
        <form method="post" class="" novalidate>
            {% csrf_token %}
            {% for field in form %}
            	<div class="">
                    <label for="{{ field.id_for_label }}" class="">{{ field.label }}</label>
                    {{ field }}
                </div>
            {% endfor %}
        </form>
    </div>
{% endblock %}
